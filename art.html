    /* ── Page base — dark theme ───────────────────────────── */
    body {
      overflow: auto;
    }

    /* ── Grid page layout ─────────────────────────────────── */
    .art-grid {
      padding-top: 140px;
      padding-bottom: 80px;
    }

    @media (max-width: 640px) {
      .art-grid { padding-top: 100px; }
    }

    .art-grid-header {
      margin-bottom: 48px;
    }

    .art-grid-header .t-label {
      color: rgba(255, 251, 243, 0.4);
    }
.art-grid-header h1 {
      color: var(--cream);
      max-width: 640px;
      margin-top: 16px;
    }

    /* ── Masonry columns ──────────────────────────────────── */
    .art-masonry {
      column-count: 3;
      column-gap: 10px;
    }
    @media (max-width: 720px)  { .art-masonry { column-count: 2; } }
    @media (max-width: 480px)  { .art-masonry { column-count: 1; } }

    /* ── Grid items ───────────────────────────────────────── */
    .art-grid-item {
      break-inside: avoid;
      margin-bottom: 10px;
      cursor: pointer;
      overflow: hidden;
      border-radius: 3px;
      position: relative;
      opacity: 0;
      transform: translateY(36px);
      transition:
        opacity 0.75s cubic-bezier(0.215, 0.61, 0.355, 1),
        transform 0.75s cubic-bezier(0.215, 0.61, 0.355, 1);
    }
    .art-grid-item.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .art-grid-item img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      background: rgba(255, 251, 243, 0.04);
    }
    .art-grid-item:hover img { transform: scale(1.02); }

    /* ── Lightbox ─────────────────────────────────────────── */
    .art-lightbox {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .art-lightbox.open {
      opacity: 1;
      pointer-events: auto;
    }

    .lb-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(20, 20, 28, 0.94);
      cursor: pointer;
    }

    .lb-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 92vw;
    }

    .lb-img {
      display: block;
      max-width: 90vw;
      max-height: 84vh;
      object-fit: contain;
      border-radius: 3px;
    }

    .lb-caption { text-align: center; }
    .lb-caption-title {
      font-size: 14px;
      color: rgba(255, 251, 243, 0.75);
      margin-bottom: 4px;
    }
    .lb-caption-meta {
      font-family: 'Offlig', monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 251, 243, 0.3);
    }

    .lb-close {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 2;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 251, 243, 0.1);
      border: 1px solid rgba(255, 251, 243, 0.2);
      border-radius: 4px;
      color: rgba(255, 251, 243, 0.7);
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .lb-close:hover {
      background: rgba(255, 251, 243, 0.18);
      color: var(--cream);
    }

    .lb-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 251, 243, 0.1);
      border: 1px solid rgba(255, 251, 243, 0.2);
      border-radius: 4px;
      color: rgba(255, 251, 243, 0.7);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .lb-arrow:hover {
      background: rgba(255, 251, 243, 0.18);
      color: var(--cream);
    }
    .lb-arrow.prev { left: 20px; }
    .lb-arrow.next { right: 20px; }

    @media (max-width: 600px) {
      .lb-img { max-width: 92vw; max-height: 74vh; }

      .lb-close {
        top: 16px;
        right: 4vw;
      }

      .lb-arrow {
        top: auto;
        bottom: 20px;
        transform: none;
      }
      .lb-arrow.prev { left: 4vw; }
      .lb-arrow.next { right: 4vw; }

      .lb-caption {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        width: max-content;
        max-width: 58vw;
        z-index: 3;
        pointer-events: none;
      }
      .lb-caption-title { font-size: 12px; }
      .lb-caption-meta  { display: none; }
    }

  <script>
    'use strict';

    /* ── State ─────────────────────────────────────────── */
    let artworks = [];
    let lbIndex  = 0;

    /* ── Build: grid ───────────────────────────────────── */
    function buildGrid() {
      const masonry = document.getElementById('artMasonry');

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
            setTimeout(() => { entry.target.style.transitionDelay = '0s'; }, 800);
          }
        });
      }, { threshold: 0.06, rootMargin: '0px 0px -40px 0px' });

      artworks.forEach((art, i) => {
        const item = document.createElement('div');
        item.className = 'art-grid-item';
        item.setAttribute('tabindex', '0');
        item.setAttribute('role', 'button');
        item.setAttribute('aria-label', art.title);
        item.setAttribute('data-cursor', 'View');
        // Staggered delay by column index (3 columns)
        item.style.transitionDelay = `${(i % 3) * 0.065}s`;

        const img = document.createElement('img');
        img.src     = art.src;
        img.alt     = art.alt;
        img.loading  = i < 6 ? 'eager' : 'lazy';
        img.decoding = 'async';
        img.style.aspectRatio = `${art.w} / ${art.h}`;
        item.appendChild(img);

        item.addEventListener('click', () => openLightbox(i));
        item.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(i); }
        });

        masonry.appendChild(item);
        observer.observe(item);
      });
    }

    /* ── Lightbox ──────────────────────────────────────── */
    function openLightbox(index) {
      lbIndex = ((index % artworks.length) + artworks.length) % artworks.length;
      const art = artworks[lbIndex];
      const lb  = document.getElementById('artLightbox');
      const img = document.getElementById('lbImg');

      img.src = art.src;
      img.alt = art.alt;

      document.getElementById('lbCaptionTitle').textContent = art.title;
      document.getElementById('lbCaptionMeta').textContent  = art.meta;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('artLightbox').classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(() => { document.getElementById('lbImg').src = ''; }, 350);
    }

    function shiftLightbox(dir) { openLightbox(lbIndex + dir); }

    document.getElementById('artLightbox').addEventListener('contextmenu', e => e.preventDefault());
    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    document.getElementById('lbBackdrop').addEventListener('click', closeLightbox);
    document.getElementById('lbPrev').addEventListener('click', () => shiftLightbox(-1));
    document.getElementById('lbNext').addEventListener('click', () => shiftLightbox(1));

    document.addEventListener('keydown', e => {
      const lb = document.getElementById('artLightbox');
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape')     closeLightbox();
      if (e.key === 'ArrowLeft')  shiftLightbox(-1);
      if (e.key === 'ArrowRight') shiftLightbox(1);
    });

    /* ── Init ──────────────────────────────────────────── */
    document.addEventListener('DOMContentLoaded', () => {
      fetch('assets/art/manifest.json')
        .then(r => r.json())
        .then(data => { artworks = data; buildGrid(); })
        .catch(err => console.error('Could not load art manifest:', err));
    });
  </script>

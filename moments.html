  <style>
    html, body {

    /* The React root fills the whole viewport */

      inset: 0;
      z-index: 0;

    /* Bottom-left page description — matches controls hint style in the canvas app */

      position: fixed;
      bottom: 24px;
      left: 28px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 3px;
      pointer-events: none;
    }

    #moments-desc span {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a89278;
      font-feature-settings: "ss02" on, "ss03" on;
    }

    .moments-hint { display: none; }

    @media (max-width: 640px) {
      #moments-desc {
        bottom: 16px;
        left: 16px;
        right: 16px;
      }
      .moments-hint {
        display: block;
        margin-top: 5px;
      }
      /* Hide canvas app's own controls overlay — our #moments-desc handles mobile instructions */
      [class*="_controls_1w3ho_32"] {
        display: none !important;
      }
    }
  </style>

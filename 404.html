  <meta charset="UTF-8">

  <meta name="robots" content="noindex, nofollow">
  <!-- base href ensures CSS/JS/asset paths resolve from root regardless
       of what URL Vercel served this 404 page for -->

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/transitions.css">

  <style>
    /* ── Trail container ────────────────────────────────── */
    .not-found-wrap {
      min-height: 80vh;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Trail images ───────────────────────────────────── */
    .trail-img {
      width: 280px;
      aspect-ratio: 14 / 9; /* matches loader image ratio */
      border-radius: 4px;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      overflow: hidden;
      will-change: transform, opacity;
      pointer-events: none;
      box-shadow: 0 16px 48px rgba(30, 30, 40, 0.14);
    }

    /* Inner image is oversized so GSAP scale:2→1 zooms without
       revealing empty space — parent overflow:hidden clips it */
    .trail-img img {
      position: absolute;
      top: -5%;
      left: -5%;
      width: 110%;
      height: 110%;
      object-fit: cover;
      display: block;
    }

    /* ── Centred text — sits above trail images ─────────── */
    .not-found-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 120px var(--px-desktop) 80px;
      pointer-events: none; /* let mouse events reach the trail layer */
    }

    /* Re-enable pointer events on interactive children */
    .not-found-content a,
    .not-found-content button {
      pointer-events: auto;
    }

    .not-found-heading {
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--dark);
      margin: 0 0 16px;
    }

    .not-found-sub {
      font-size: clamp(15px, 1.6vw, 18px);
      color: rgba(30, 30, 40, 0.5);
      max-width: 400px;
      line-height: 1.6;
      margin: 0 auto 44px;
    }

    .not-found-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .not-found-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 4px;
      font-family: var(--font-meta);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
      cursor: pointer;
    }

    .not-found-btn--primary {
      background: var(--dark);
      color: var(--cream);
      border: 1.5px solid var(--dark);
    }
    .not-found-btn--primary:hover {
      background: var(--maroon);
      border-color: var(--maroon);
    }

    .not-found-btn--ghost {
      background: transparent;
      color: var(--dark);
      border: 1.5px solid rgba(30, 30, 40, 0.2);
    }
    .not-found-btn--ghost:hover {
      border-color: var(--dark);
    }

    @media (max-width: 640px) {
      .not-found-content {
        padding: 100px var(--px-mobile) 60px;
      }
      .not-found-actions {
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        max-width: 280px;
      }
      .not-found-btn {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div id="page-veil"></div>

  <main class="page-main">
    <div class="not-found-wrap">

      <!-- Trail images — cycled by JS on mouse move -->
      <div class="trail-img"><img src="assets/images/loader/01-Loader.avif" alt=""></div>
      <div class="trail-img"><img src="assets/images/loader/02-Loader.avif" alt=""></div>
      <div class="trail-img"><img src="assets/images/loader/03-Loader.avif" alt=""></div>
      <div class="trail-img"><img src="assets/images/loader/04-Loader.avif" alt=""></div>
      <div class="trail-img"><img src="assets/images/loader/05-Loader.avif" alt=""></div>
      <div class="trail-img"><img src="assets/images/loader/06-Loader.avif" alt=""></div>
      <div class="trail-img"><img src="assets/images/loader/07-Loader.avif" alt=""></div>

      <!-- Centred content -->
      <div class="not-found-content">
        <h1 class="not-found-heading">Wrong turn.</h1>
        <p class="not-found-sub">This page doesn't exist — or it moved somewhere without leaving a note.</p>
        <div class="not-found-actions">
          <a href="/" class="not-found-btn not-found-btn--primary">Back to Home</a>
          <a href="/featured" class="not-found-btn not-found-btn--ghost">See the Work</a>
        </div>
      </div>

    </div>
  </main>

  <script src="js/nav.js"></script>
  <script src="js/transitions.js"></script>

  <!-- GSAP for trail animation — loaded only on this page -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
  (function () {
    'use strict';

    // Skip on touch-only devices — trail needs a mouse
    if (window.matchMedia('(hover: none)').matches) return;

    const container = document.querySelector('.not-found-wrap');
    if (!container || typeof gsap === 'undefined') return;

    const imgs   = [...container.querySelectorAll('.trail-img')];
    const total  = imgs.length;
    const THRESH = 60; // px of mouse travel before next image appears

    let imgPos      = 0;
    let zVal        = 1;
    let activeCount = 0;
    let isIdle      = true;

    let mouse     = { x: 0, y: 0 };
    let lastMouse = { x: 0, y: 0 };
    let cache     = { x: 0, y: 0 };
    let rafId     = null;

    const lerp = (a, b, n) => (1 - n) * a + n * b;
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    function getPos(e) {
      const r = container.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    container.addEventListener('mousemove', function onFirstMove(e) {
      cache = getPos(e);
      lastMouse = { ...cache };
      container.removeEventListener('mousemove', onFirstMove);
      rafId = requestAnimationFrame(render);
    }, { once: true });

    container.addEventListener('mousemove', e => {
      mouse = getPos(e);
    });

    function showNext() {
      zVal++;
      imgPos = (imgPos + 1) % total;

      const el  = imgs[imgPos];
      const img = el.querySelector('img');
      const w   = el.offsetWidth;
      const h   = el.offsetHeight;

      gsap.killTweensOf([el, img]);

      activeCount++;
      isIdle = false;

      gsap.timeline({
        onComplete: () => {
          activeCount--;
          if (activeCount === 0) {
            isIdle = true;
            zVal   = 1;
          }
        }
      })
      // Outer: pop in at cursor, scale up from small, then shrink away
      .fromTo(el, {
        opacity : 1,
        scale   : 0.2,
        zIndex  : zVal,
        x       : cache.x - w / 2,
        y       : cache.y - h / 2
      }, {
        duration : 0.4,
        ease     : 'power2.out',
        scale    : 1,
        x        : mouse.x - w / 2,
        y        : mouse.y - h / 2
      }, 0)
      // Inner image: zoom in from 2× to 1× as card appears
      .fromTo(img, { scale: 2 }, {
        duration : 0.4,
        ease     : 'power2.out',
        scale    : 1
      }, 0)
      // Fade + shrink out
      .to(el, {
        duration : 0.4,
        ease     : 'power2.in',
        opacity  : 0,
        scale    : 0.2
      }, 0.5);
    }

    function render() {
      cache.x = lerp(cache.x, mouse.x, 0.1);
      cache.y = lerp(cache.y, mouse.y, 0.1);

      if (dist(mouse, lastMouse) > THRESH) {
        showNext();
        lastMouse = { ...mouse };
      }

      rafId = requestAnimationFrame(render);
    }

  })();
  </script>

</body>
</html>

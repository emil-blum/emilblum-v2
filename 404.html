<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1S2H0DK0GM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-1S2H0DK0GM');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Emīl Blūm</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/transitions.css">

  <style>
    .not-found-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px var(--px-desktop) 80px;
    }

    .not-found-num {
      font-family: var(--font-body);
      font-size: clamp(7rem, 20vw, 16rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--cream);
      -webkit-text-stroke: 2px rgba(30, 30, 40, 0.12);
      color: transparent;
      margin: 0 0 8px;
      user-select: none;
    }

    .not-found-heading {
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--dark);
      margin: 0 0 16px;
    }

    .not-found-sub {
      font-size: clamp(15px, 1.6vw, 18px);
      color: rgba(30, 30, 40, 0.5);
      max-width: 400px;
      line-height: 1.6;
      margin: 0 auto 44px;
    }

    .not-found-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .not-found-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 4px;
      font-family: var(--font-meta);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
      cursor: pointer;
    }

    .not-found-btn--primary {
      background: var(--dark);
      color: var(--cream);
      border: 1.5px solid var(--dark);
    }
    .not-found-btn--primary:hover {
      background: var(--maroon);
      border-color: var(--maroon);
    }

    .not-found-btn--ghost {
      background: transparent;
      color: var(--dark);
      border: 1.5px solid rgba(30, 30, 40, 0.2);
    }
    .not-found-btn--ghost:hover {
      border-color: var(--dark);
    }

    @media (max-width: 640px) {
      .not-found-wrap {
        padding: 100px var(--px-mobile) 60px;
      }
      .not-found-actions {
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        max-width: 280px;
      }
      .not-found-btn {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div id="page-veil"></div>

  <main class="page-main">
    <div class="not-found-wrap">
      <p class="not-found-num" aria-hidden="true">404</p>
      <h1 class="not-found-heading">Wrong turn.</h1>
      <p class="not-found-sub">This page doesn't exist — or it moved somewhere without leaving a note.</p>
      <div class="not-found-actions">
        <a href="/" class="not-found-btn not-found-btn--primary">Back to Home</a>
        <a href="/featured" class="not-found-btn not-found-btn--ghost">See the Work</a>
      </div>
    </div>
  </main>

  <script src="js/nav.js"></script>
  <script src="js/transitions.js"></script>
</body>
</html>

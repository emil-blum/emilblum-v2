  <!-- Fonts -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap">

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/transitions.css">

  <style>
    /* ── Page layout ────────────────────────────────────── */
    .not-found-wrap {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Trail images
         position: fixed so they cover the full viewport,
         not clipped by any parent container.
         z-index: 100 — above page content, below nav (200).     ── */
    .trail-img {
      width: 280px;
      aspect-ratio: 14 / 9;
      border-radius: 4px;
      position: fixed;
      top: 0;
      left: 0;
      opacity: 0;
      overflow: hidden;
      will-change: transform, opacity;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 16px 48px rgba(30, 30, 40, 0.14);
    }

    /* Simple full-cover img — GSAP scale on this element
       creates the zoom-in effect; overflow:hidden clips it. */
    .trail-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Centred content ────────────────────────────────── */
    .not-found-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 120px var(--px-desktop) 80px;
    }

    .not-found-heading {
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--dark);
      margin: 0 0 16px;
    }

    .not-found-sub {
      font-size: clamp(15px, 1.6vw, 18px);
      color: rgba(30, 30, 40, 0.5);
      max-width: 400px;
      line-height: 1.6;
      margin: 0 auto 44px;
    }

    .not-found-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .not-found-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 4px;
      font-family: var(--font-meta);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
      cursor: pointer;
    }

    .not-found-btn--primary {
      background: var(--dark);
      color: var(--cream);
      border: 1.5px solid var(--dark);
    }
    .not-found-btn--primary:hover {
      background: var(--maroon);
      border-color: var(--maroon);
    }

    .not-found-btn--ghost {
      background: transparent;
      color: var(--dark);
      border: 1.5px solid rgba(30, 30, 40, 0.2);
    }
    .not-found-btn--ghost:hover {
      border-color: var(--dark);
    }

    @media (max-width: 640px) {
      .not-found-content {
        padding: 100px var(--px-mobile) 60px;
      }
      .not-found-actions {
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        max-width: 280px;
      }
      .not-found-btn {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div id="page-veil"></div>

  <div class="trail-img"><img src="assets/images/loader/02-Loader.avif" alt=""></div>

  <main class="page-main">
    <div class="not-found-wrap">
      <div class="not-found-content">
        <h1 class="not-found-heading">Wrong turn.</h1>
        <p class="not-found-sub">This page doesn't exist — or it moved somewhere without leaving a note.</p>
        <div class="not-found-actions">

        </div>
      </div>
    </div>

  <script src="js/nav.js"></script>
  <script src="js/transitions.js"></script>

  <!-- GSAP — trail animation, this page only -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
  (function () {
    'use strict';

    // Skip on touch-only devices
    if (window.matchMedia('(hover: none)').matches) return;
    if (typeof gsap === 'undefined') return;

    const imgs   = [...document.querySelectorAll('.trail-img')];
    const total  = imgs.length;
    const THRESH = 60; // px of mouse travel before next image fires

    let imgPos      = 0;
    let zVal        = 1;
    let activeCount = 0;
    let paused      = false; // true when cursor is over interactive element

    // Use raw clientX/clientY — images are position:fixed (viewport coords)
    let mouse     = { x: 0, y: 0 };
    let lastMouse = { x: 0, y: 0 };
    let cache     = { x: 0, y: 0 };

    const lerp = (a, b, n) => (1 - n) * a + n * b;
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    // Pause trail when cursor is over nav, buttons, or links
    function isInteractive(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el) return false;
      return !!el.closest('a, button, [role="button"], .site-nav, .ctx-menu');
    }

    // Kick off on first move
    document.addEventListener('mousemove', function onFirst(e) {
      mouse = cache = lastMouse = { x: e.clientX, y: e.clientY };
      document.removeEventListener('mousemove', onFirst);
      requestAnimationFrame(render);
    }, { once: true });

    document.addEventListener('mousemove', e => {
      mouse  = { x: e.clientX, y: e.clientY };
      paused = isInteractive(e.clientX, e.clientY);
    });

    function showNext() {
      zVal++;
      imgPos = (imgPos + 1) % total;

      const el  = imgs[imgPos];
      const img = el.querySelector('img');
      const w   = el.offsetWidth;
      const h   = el.offsetHeight;

      gsap.killTweensOf([el, img]);
      activeCount++;

      gsap.timeline({
        onComplete: () => {
          activeCount--;
          if (activeCount === 0) zVal = 1;
        }
      })
      // Card slides from cached pos to current mouse pos, fades in
      .fromTo(el, {
        opacity : 1,
        zIndex  : zVal,
        x       : cache.x - w / 2,
        y       : cache.y - h / 2
      }, {
        x        : mouse.x - w / 2,
        y        : mouse.y - h / 2,
        duration : 0.35,
        ease     : 'power2.out'
      }, 0)
      // Inner image zooms from 1.5× to 1× as card arrives
      .fromTo(img, { scale: 1.5 }, {
        scale    : 1,
        duration : 0.35,
        ease     : 'power2.out'
      }, 0)
      // Fade out
      .to(el, {
        opacity  : 0,
        duration : 0.35,
        ease     : 'power2.in'
      }, 0.45);
    }

    function render() {
      cache.x = lerp(cache.x, mouse.x, 0.1);
      cache.y = lerp(cache.y, mouse.y, 0.1);

      if (!paused && dist(mouse, lastMouse) > THRESH) {
        showNext();
        lastMouse = { ...mouse };
      }

      requestAnimationFrame(render);
    }

  })();
  </script>

</body>
